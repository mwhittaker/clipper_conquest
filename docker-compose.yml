# The game server:  docker compose up -d --build     players: http://localhost:8080/
# The admin page:   http://localhost:8080/admin
# The game lives in ./game-data. Stop with: docker compose down
services:
  server:
    build: .
    ports:
      - "${CLIPPER_PORT:-8080}:8080"
    volumes:
      - ./game-data:/data
      - .:/app:ro          # serve the files as they are, so edits show up on a refresh
    restart: unless-stopped
