<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper Conquest — Race Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #131A2A;
    --water:  #0F1526;
    --panel:  #1B2438;
    --edge:   #29344E;
    --ink:    #F2F5FA;
    --muted:  #8B96AC;
    --fog:    #F5A623;
    --surf:   #4FC3F7;
    --open-fill: #202A42;
    --park-fill: #1D2A28;
    --park-dot:  #273633;
    --display: 'Anton', 'Archivo', sans-serif;
    --body: 'Archivo', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    border-left: 1px solid var(--edge);
    border-right: 1px solid var(--edge);
    overflow: hidden;
  }
  @media (max-width: 480px) {
    .app { border-left: 0; border-right: 0; }
  }

  /* ============ CHYRON SCOREBOARD ============ */
  .chyron {
    display: flex;
    align-items: stretch;
    height: 64px;
    background: var(--water);
    flex: none;
  }
  .chy-team {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
    min-width: 0;
  }
  .chy-fog {
    background: var(--fog);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    padding: 0 26px 0 14px;
    justify-content: flex-start;
  }
  .chy-surf {
    background: var(--surf);
    clip-path: polygon(18px 0, 100% 0, 100% 100%, 0 100%);
    padding: 0 14px 0 26px;
    justify-content: flex-end;
  }
  .chy-name {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .chy-surf .chy-name { align-items: flex-end; }
  .chy-name .team {
    font-family: var(--display);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #131A2A;
    white-space: nowrap;
  }
  .chy-name .role {
    font-weight: 800;
    font-size: 8px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #131A2A;
    background: rgba(19, 26, 42, 0.16);
    padding: 2px 5px;
    align-self: flex-start;
  }
  .chy-surf .chy-name .role { align-self: flex-end; }
  .chy-num {
    font-family: var(--display);
    font-size: 36px;
    line-height: 1;
    color: #131A2A;
    font-variant-numeric: tabular-nums;
  }
  .chy-clock {
    flex: none;
    width: 140px;
    margin: 0 -18px;
    background: var(--water);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    z-index: 0;
    padding: 0 18px;
  }
  .chy-clock .lbl {
    font-weight: 800;
    font-size: 8px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .chy-clock .time {
    font-family: var(--display);
    font-size: 26px;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  /* strip under the chyron */
  .strip {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    padding: 5px 14px;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
  }
  .live-bug {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--ink);
  }
  .live-dot {
    width: 6px; height: 6px;
    background: var(--ink);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .strip .sep { color: var(--edge); }
  .strip .contested { color: var(--ink); display: inline-flex; align-items: center; gap: 5px; }
  .swatch-tied {
    display: inline-block;
    width: 12px; height: 8px;
    background: repeating-linear-gradient(-45deg,
      var(--fog) 0 3px, var(--surf) 3px 6px);
  }

  /* ============ MAP ============ */
  .map-wrap {
    flex: 1 1 auto;
    min-height: 150px;
    position: relative;
    background: var(--water);
    overflow: hidden;
  }
  svg.cc-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hood { stroke: var(--water); stroke-width: 1; cursor: pointer; }
  .hood--fog  { fill: var(--fog); }
  .hood--surf { fill: var(--surf); }
  .hood--tied { fill: url(#cc-tied); }
  .hood--open { fill: var(--open-fill); }
  .hood--selected {
    stroke: var(--ink);
    stroke-width: 1.6;
    filter: drop-shadow(0 0 3px rgba(242, 245, 250, 0.85));
  }
  .hood:focus { outline: none; }
  .hood:focus-visible {
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-dasharray: 3 2;
  }
  .park { fill: url(#cc-park); stroke: var(--water); stroke-width: 1; }

  .hood-badge {
    font-family: var(--body);
    font-weight: 800;
    font-size: 7.5px;
    fill: var(--ink);
    stroke: #10182B;
    stroke-width: 2.2px;
    paint-order: stroke;
    stroke-linejoin: round;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .hood-label {
    font-family: var(--body);
    font-weight: 600;
    font-size: 4.6px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    fill: var(--muted);
    pointer-events: none;
  }

  /* map key */
  .map-key {
    position: absolute;
    left: 0; right: 0; top: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 8px 14px 14px;
    background: linear-gradient(180deg, rgba(15, 21, 38, 0.92), rgba(15, 21, 38, 0));
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
  }
  .map-key span { display: inline-flex; align-items: center; gap: 4px; }
  .map-key i {
    display: inline-block;
    width: 10px; height: 8px;
  }
  .key-fog i  { background: var(--fog); }
  .key-surf i { background: var(--surf); }
  .key-tied i { background: repeating-linear-gradient(-45deg, var(--fog) 0 2.5px, var(--surf) 2.5px 5px); }
  .key-open i { background: var(--open-fill); }
  .key-park i { background: var(--park-fill); }

  /* ============ LIVE TICKER ============ */
  .ticker {
    flex: none;
    background: var(--water);
    border-top: 1px solid var(--edge);
    border-bottom: 1px solid var(--edge);
    overflow: hidden;
    display: flex;
    align-items: stretch;
  }
  .ticker-tag {
    flex: none;
    display: flex;
    align-items: center;
    background: var(--ink);
    color: #131A2A;
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 10px 0 12px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    z-index: 1;
  }
  .ticker-view { flex: 1 1 auto; overflow: hidden; }
  .ticker-track {
    display: flex;
    width: max-content;
    animation: marquee 38s linear infinite;
  }
  .ticker-group {
    display: flex;
    align-items: center;
    white-space: nowrap;
    padding: 7px 0;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tk-time { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 6px 0 14px; }
  .tk-text { color: var(--ink); }
  .tk-text.tk--fog  { color: var(--fog); }
  .tk-text.tk--surf { color: var(--surf); }
  .tk-sep { color: var(--muted); margin-left: 14px; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* ============ BOTTOM SHEET ============ */
  .sheet {
    flex: 0 1 auto;
    background: var(--panel);
    border-top: 2px solid var(--edge);
    overflow-y: auto;
    padding: 8px 14px 16px;
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--edge);
    margin: 0 auto 10px;
  }
  .sheet-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .sheet-eyebrow {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .sheet-name {
    font-family: var(--display);
    font-size: 28px;
    line-height: 1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .hold-chip {
    flex: none;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #131A2A;
    padding: 5px 9px;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    font-variant-numeric: tabular-nums;
  }
  .hold-chip--surf { background: var(--surf); }
  .hold-chip--fog  { background: var(--fog); }
  .hold-chip--tied { background: repeating-linear-gradient(-45deg, var(--fog) 0 6px, var(--surf) 6px 12px); }
  .hold-chip--open { background: var(--muted); }

  .sheet-note {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--ground);
    border-left: 3px solid var(--fog);
    padding: 8px 10px;
    margin-bottom: 12px;
  }
  .sheet-note .who { color: var(--muted); font-weight: 800; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; display: block; margin-bottom: 2px; }

  .challenge {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 2px 10px;
    padding: 10px 0;
    border-top: 1px solid var(--edge);
  }
  .ch-num {
    grid-row: 1 / span 2;
    font-family: var(--display);
    font-size: 22px;
    line-height: 1;
    color: var(--edge);
    padding-top: 1px;
  }
  .challenge--live .ch-num { color: var(--muted); }
  .ch-title { font-weight: 600; font-size: 13px; color: var(--ink); }
  .ch-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
  }
  .ch-chip {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ch-chip--fog  { background: var(--fog);  color: #131A2A; }
  .ch-chip--surf { background: var(--surf); color: #131A2A; }
  .ch-chip--wait { background: transparent; color: var(--muted); border: 1px dashed var(--muted); padding: 2px 6px; }

  .btn-cta {
    margin-left: auto;
    border: 0;
    background: var(--fog);
    color: #131A2A;
    font-family: var(--body);
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 14px;
    transform: skewX(-8deg);
    cursor: pointer;
  }
  .btn-cta > span { display: inline-block; transform: skewX(8deg); }
  .btn-cta:hover { background: #FFB93D; }
  .btn-cta:active { transform: skewX(-8deg) translateY(1px); }
  .btn-cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .btn-proof {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--ink);
    font-family: var(--body);
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 14px;
    cursor: pointer;
  }
  .btn-proof:hover { border-color: var(--ink); }
  .btn-proof:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .proof-hint {
    margin-top: 5px;
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
  }

  .sheet-away {
    font-size: 12.5px;
    color: var(--muted);
    padding: 4px 0 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
    .live-dot { animation: none; }
    .btn-cta:active { transform: skewX(-8deg); }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Chyron scoreboard -->
  <header class="chyron" aria-label="Scoreboard">
    <div class="chy-team chy-fog">
      <div class="chy-name">
        <span class="team">Team Fog</span>
        <span class="role">Your team</span>
      </div>
      <div class="chy-num" id="score-fog">4</div>
    </div>
    <div class="chy-clock">
      <span class="lbl">Remaining</span>
      <span class="time" id="clock">2:47:12</span>
    </div>
    <div class="chy-team chy-surf">
      <div class="chy-num" id="score-surf">3</div>
      <div class="chy-name">
        <span class="team">Team Surf</span>
        <span class="role">Rivals</span>
      </div>
    </div>
  </header>

  <div class="strip">
    <span class="live-bug"><span class="live-dot" aria-hidden="true"></span>Live</span>
    <span class="sep" aria-hidden="true">|</span>
    <span>Neighborhoods held</span>
    <span class="sep" aria-hidden="true">|</span>
    <span class="contested"><i class="swatch-tied" aria-hidden="true"></i><span id="contested-n">2</span>&nbsp;Contested</span>
  </div>

  <!-- Map -->
  <main class="map-wrap" aria-label="Territory map of San Francisco">
    <svg class="cc-map" viewBox="0 0 200 200" role="img" aria-label="Map of neighborhoods colored by which team holds them">
      <defs>
        <pattern id="cc-tied" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <rect width="6" height="6" fill="#F5A623"></rect>
          <rect x="3" width="3" height="6" fill="#4FC3F7"></rect>
        </pattern>
        <pattern id="cc-park" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="#1D2A28"></rect>
          <circle cx="1.5" cy="1.5" r="0.7" fill="#273633"></circle>
          <circle cx="4.5" cy="4.5" r="0.7" fill="#273633"></circle>
        </pattern>
      </defs>
    </svg>
    <div class="map-key" aria-hidden="true">
      <span class="key-fog"><i></i>Fog held</span>
      <span class="key-surf"><i></i>Surf held</span>
      <span class="key-tied"><i></i>Contested</span>
      <span class="key-open"><i></i>Open</span>
      <span class="key-park"><i></i>Park</span>
    </div>
  </main>

  <!-- Live ticker -->
  <div class="ticker" aria-label="Latest race activity">
    <span class="ticker-tag">Latest</span>
    <div class="ticker-view">
      <div class="ticker-track" id="ticker-track"></div>
    </div>
  </div>

  <!-- Bottom sheet -->
  <section class="sheet" id="sheet" aria-label="Neighborhood detail">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </section>

</div>

<script src="shared.js"></script>
<script>
(function () {
  // ---- Header ----
  document.getElementById('score-fog').textContent = CC.score.fog;
  document.getElementById('score-surf').textContent = CC.score.surf;
  document.getElementById('clock').textContent = CC.clock;
  document.getElementById('contested-n').textContent = CC.score.contested;

  // ---- Map ----
  var svg = document.querySelector('svg.cc-map');
  ccRenderMap(svg, { badges: true, labels: ['presidio', 'ggpark'] });

  // ---- Ticker (two identical groups for a seamless loop) ----
  function tickerGroup() {
    var g = document.createElement('div');
    g.className = 'ticker-group';
    CC.feed.forEach(function (item) {
      var t = document.createElement('span');
      t.className = 'tk-time';
      t.textContent = item.t;
      var x = document.createElement('span');
      x.className = 'tk-text tk--' + item.team;
      x.textContent = item.text;
      var s = document.createElement('span');
      s.className = 'tk-sep';
      s.textContent = '▸';
      g.appendChild(t); g.appendChild(x); g.appendChild(s);
    });
    return g;
  }
  var track = document.getElementById('ticker-track');
  track.appendChild(tickerGroup());
  track.appendChild(tickerGroup());

  // ---- Bottom sheet ----
  var TEAM = { fog: CC.teams.fog.name, surf: CC.teams.surf.name };

  function holdSummary(id, name) {
    var st = CC.state[id] || [0, 0];
    var f = st[0], s = st[1];
    if (f === 0 && s === 0) return name + ' is untouched. The first completed challenge takes it.';
    if (f === s) return name + ' is contested ' + f + '–' + s + '. The next completion takes the lead.';
    if (f > s) return TEAM.fog + ' holds ' + name + ' ' + f + '–' + s + '.';
    return TEAM.surf + ' holds ' + name + ' ' + s + '–' + f + '.';
  }

  function chipHTML(team, when) {
    var label = team === 'fog' ? 'Fog' : 'Surf';
    if (when) {
      return '<span class="ch-chip ch-chip--' + team + '">' + label + ' · ' + when + '</span>';
    }
    return '<span class="ch-chip ch-chip--wait">' + label + ' —</span>';
  }

  function chipClass(state) {
    if (state === 'fog')  return 'hold-chip--fog';
    if (state === 'surf') return 'hold-chip--surf';
    if (state === 'tied') return 'hold-chip--tied';
    return 'hold-chip--open';
  }

  function chipText(state, st) {
    if (state === 'fog')  return 'Fog lead ' + st[0] + '–' + st[1];
    if (state === 'surf') return 'Surf lead ' + st[1] + '–' + st[0];
    if (state === 'tied') return 'Tied ' + st[0] + '–' + st[1];
    return 'Open';
  }

  function renderSheet(id) {
    var hood = CC.HOODS.find(function (h) { return h.id === id; });
    if (!hood) return;
    var st = CC.state[id] || [0, 0];
    var state = ccHoodState(id);
    var html = '';

    html += '<div class="sheet-head">';
    html += '<div><div class="sheet-eyebrow">Neighborhood</div>';
    html += '<h1 class="sheet-name">' + hood.name + '</h1></div>';
    html += '<span class="hold-chip ' + chipClass(state) + '">' + chipText(state, st) + '</span>';
    html += '</div>';

    if (id === CC.detail.id) {
      html += '<p class="sheet-note"><span class="who">Race control</span>' + CC.detail.note + '</p>';
      CC.detail.challenges.forEach(function (ch) {
        var live = !ch.fog; // still open for your team (Team Fog)
        html += '<div class="challenge' + (live ? ' challenge--live' : '') + '">';
        html += '<div class="ch-num">' + ch.n + '</div>';
        html += '<div class="ch-title">' + ch.title + '</div>';
        html += '<div class="ch-meta">';
        html += chipHTML('fog', ch.fog);
        html += chipHTML('surf', ch.surf);
        if (live) {
          html += '<button type="button" class="btn-cta"><span>Mark complete</span></button>';
        }
        html += '</div></div>';
      });
      html += '<button type="button" class="btn-proof">Add photo or video (optional)</button>';
      html += '<p class="proof-hint">Honor system — proof is optional.</p>';
    } else {
      html += '<p class="sheet-note"><span class="who">Race control</span>' + holdSummary(id, hood.name) + '</p>';
      html += '<p class="sheet-away">Travel here to open its three challenges. Completions by Team Surf never block yours — each team scores independently.</p>';
    }

    document.getElementById('sheet-body').innerHTML = html;
  }

  renderSheet(CC.selected);

  // ---- Light interactivity: tap a neighborhood to inspect it ----
  var current = CC.selected;
  svg.querySelectorAll('.hood').forEach(function (p) {
    p.setAttribute('tabindex', '0');
    p.setAttribute('role', 'button');
    var hood = CC.HOODS.find(function (h) { return h.id === p.dataset.id; });
    p.setAttribute('aria-label', 'Inspect ' + (hood ? hood.name : p.dataset.id));
    function select() {
      var prev = svg.querySelector('.hood--selected');
      if (prev) prev.classList.remove('hood--selected');
      p.classList.add('hood--selected');
      current = p.dataset.id;
      renderSheet(current);
    }
    p.addEventListener('click', select);
    p.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); }
    });
  });
})();
</script>
</body>
</html>
