<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper Conquest — Skirmish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #10122B;      /* deep indigo — water / page */
    --panel:  #181B38;      /* untouched territory, panels */
    --grid:   #1D2142;      /* grid lines */
    --edge:   #343A6E;      /* lighter panel tone — borders */
    --ink:    #E8EAFF;
    --muted:  #7E84B0;
    --fog:    #FF5CA8;      /* Team Fog — magenta */
    --fog-dk: #45183A;      /* dark cell of the Fog dither */
    --surf:   #43E97B;      /* Team Surf — green */
    --surf-dk:#123524;      /* dark cell of the Surf dither */
    --void:   #0B0D20;      /* outside the app column */
    --shadow: #05060F;      /* hard pixel shadows */
    --px: "Press Start 2P", monospace;
    --vt: "VT323", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--vt);
    font-size: 20px;
    line-height: 1.25;
    overflow-x: hidden;
    -webkit-font-smoothing: none;
  }

  .app {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    border-left: 2px solid var(--grid);
    border-right: 2px solid var(--grid);
  }

  /* ---------- scanline overlay (signature) ---------- */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      #000 0, #000 1px,
      transparent 1px, transparent 3px
    );
    opacity: 0.08;
  }

  /* ---------- top HUD ---------- */
  .hud {
    flex: none;
    padding: 12px 14px 10px;
    background: var(--panel);
    border-bottom: 2px solid var(--edge);
  }
  .hud-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .hud-title {
    font-family: var(--px);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--ink);
  }
  .hud-title small {
    display: block;
    margin-top: 5px;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .hud-clock {
    font-family: var(--px);
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--muted);
    text-align: right;
  }
  .hud-clock b {
    display: block;
    margin-top: 3px;
    font-family: var(--vt);
    font-weight: 400;
    font-size: 24px;
    letter-spacing: 2px;
    color: var(--ink);
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .bar-row:last-of-type { margin-bottom: 6px; }
  .bar-name {
    font-family: var(--px);
    font-size: 9px;
    letter-spacing: 1px;
    width: 46px;
    flex: none;
  }
  .bar-name--fog  { color: var(--fog); }
  .bar-name--surf { color: var(--surf); }
  .bar {
    display: flex;
    gap: 3px;
    flex: 1;
  }
  .seg {
    flex: 1;
    height: 13px;
    background: var(--grid);
    box-shadow: inset 0 0 0 1px var(--edge);
  }
  .seg--fog  { background: var(--fog);  box-shadow: inset 0 0 0 1px var(--fog); }
  .seg--surf { background: var(--surf); box-shadow: inset 0 0 0 1px var(--surf); }
  .bar-count {
    font-family: var(--vt);
    font-size: 24px;
    width: 20px;
    flex: none;
    text-align: right;
  }
  .bar-count--fog  { color: var(--fog); }
  .bar-count--surf { color: var(--surf); }
  .hud-sub {
    font-family: var(--vt);
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--muted);
  }

  /* ---------- map ---------- */
  .map-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 10px 4px;
    background-image:
      repeating-linear-gradient(to right,  var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 14px),
      repeating-linear-gradient(to bottom, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 14px);
  }
  svg.cc-map {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 420px;
  }

  .hood, .park { shape-rendering: crispEdges; }
  .hood {
    stroke: var(--edge);
    stroke-width: 1;
  }
  .hood--fog  { fill: url(#dither-fog); }
  .hood--surf { fill: url(#dither-surf); }
  .hood--tied { fill: url(#dither-tied); }
  .hood--open { fill: var(--panel); }
  .park {
    fill: #12142E;
    stroke: var(--grid);
    stroke-width: 1;
  }
  .hood--selected {
    stroke: var(--ink);
    stroke-width: 1.6;
    animation: sel-blink 0.9s steps(1, end) infinite;
  }
  @keyframes sel-blink {
    0%, 49.9% { stroke: var(--ink); }
    50%, 100% { stroke: var(--muted); }
  }

  .hood-badge {
    font-family: var(--vt);
    font-size: 8px;
    fill: var(--ink);
    stroke: var(--ground);
    stroke-width: 1.4px;
    paint-order: stroke;
    pointer-events: none;
  }
  .hood-label {
    font-family: var(--px);
    font-size: 4.4px;
    letter-spacing: 0.5px;
    fill: var(--ink);
    stroke: var(--ground);
    stroke-width: 1.2px;
    paint-order: stroke;
    pointer-events: none;
    text-transform: uppercase;
  }
  .park-label {
    font-family: var(--px);
    font-size: 4px;
    letter-spacing: 0.5px;
    fill: var(--muted);
    pointer-events: none;
  }

  /* map legend — names paired with every fill */
  .legend {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    column-gap: 14px;
    row-gap: 2px;
    padding: 4px 0 2px;
    font-family: var(--vt);
    font-size: 17px;
    color: var(--muted);
  }
  .legend .key {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .legend svg { display: block; }
  .legend .key--fog  { color: var(--fog); }
  .legend .key--surf { color: var(--surf); }

  /* ---------- alert line (signature) ---------- */
  .alert {
    flex: none;
    padding: 9px 14px;
    background: var(--panel);
    border-top: 2px solid var(--edge);
    font-family: var(--px);
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
  }
  .alert .cursor {
    color: var(--surf);
    animation: cursor-blink 1s steps(1, end) infinite;
  }
  .alert .alert-surf { color: var(--surf); }
  @keyframes cursor-blink {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  /* ---------- bottom sheet: quest log ---------- */
  .sheet-frame {
    flex: none;
    margin: 0 8px 8px;
    padding: 2px;                    /* the 2px pixel border */
    background: var(--edge);
    clip-path: polygon(
      10px 0, calc(100% - 10px) 0, 100% 10px,
      100% calc(100% - 10px), calc(100% - 10px) 100%,
      10px 100%, 0 calc(100% - 10px), 0 10px
    );
  }
  .sheet {
    background: var(--panel);
    clip-path: polygon(
      9px 0, calc(100% - 9px) 0, 100% 9px,
      100% calc(100% - 9px), calc(100% - 9px) 100%,
      9px 100%, 0 calc(100% - 9px), 0 9px
    );
    padding: 12px 14px 14px;
    max-height: 46dvh;
    overflow-y: auto;
  }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .sheet-title {
    font-family: var(--px);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink);
  }
  .holder-tag {
    font-family: var(--px);
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--ground);
    background: var(--surf);
    padding: 5px 7px 4px;
    flex: none;
  }
  .sheet-note {
    font-family: var(--vt);
    font-size: 19px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .sheet-note b {
    color: var(--ink);
    font-weight: 400;
  }

  .quest {
    border-top: 1px solid var(--grid);
    padding: 9px 0;
  }
  .quest:last-child { padding-bottom: 0; }
  .quest-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .quest-num {
    font-family: var(--px);
    font-size: 8px;
    color: var(--muted);
    flex: none;
  }
  .quest-title {
    font-family: var(--vt);
    font-size: 20px;
    color: var(--ink);
  }
  .quest-marks {
    display: flex;
    gap: 18px;
    margin-top: 2px;
    padding-left: 26px;
    font-family: var(--vt);
    font-size: 18px;
    letter-spacing: 1px;
  }
  .mark--fog  { color: var(--fog); }
  .mark--surf { color: var(--surf); }
  .mark--openslot { color: var(--muted); }

  .quest-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    padding-left: 26px;
  }
  .btn {
    font-family: var(--px);
    letter-spacing: 1px;
    cursor: pointer;
    text-align: center;
    width: 100%;
  }
  .btn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  .btn-primary {
    font-size: 9px;
    color: var(--ground);
    background: var(--fog);
    border: none;
    padding: 13px 10px;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .btn-primary:active {
    transform: translate(3px, 3px);
    box-shadow: none;
  }
  .btn-secondary {
    font-size: 8px;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--edge);
    padding: 10px 8px;
  }
  .btn-secondary:active { background: var(--grid); }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .hood--selected { animation: none; stroke: var(--ink); }
    .alert .cursor  { animation: none; opacity: 1; }
  }

  @media (max-width: 340px) {
    .hud-clock b { font-size: 20px; }
    .quest-marks { flex-wrap: wrap; gap: 4px 18px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ TOP HUD ============ -->
  <header class="hud">
    <div class="hud-top">
      <h1 class="hud-title">CLIPPER CONQUEST<small>TERRITORY WAR — SF</small></h1>
      <div class="hud-clock">TIME LEFT<b id="clock">2:47:12</b></div>
    </div>

    <div class="bar-row" id="bar-fog" role="img" aria-label="Team Fog holds 4 neighborhoods">
      <span class="bar-name bar-name--fog">FOG</span>
      <span class="bar" aria-hidden="true"></span>
      <span class="bar-count bar-count--fog">4</span>
    </div>
    <div class="bar-row" id="bar-surf" role="img" aria-label="Team Surf holds 3 neighborhoods">
      <span class="bar-name bar-name--surf">SURF</span>
      <span class="bar" aria-hidden="true"></span>
      <span class="bar-count bar-count--surf">3</span>
    </div>

    <p class="hud-sub" id="hud-sub">CONTESTED 2 · OPEN 6 · HOLD 8 OF 15 TO WIN</p>
  </header>

  <!-- ============ MAP ============ -->
  <main class="map-wrap">
    <svg class="cc-map" viewBox="0 0 200 200" role="img"
         aria-label="Map of San Francisco neighborhoods. Team Fog holds 4, Team Surf holds 3, 2 are tied, 6 untouched. Mission is selected.">
      <defs>
        <!-- Team Fog: fine checkerboard dither, axis-aligned -->
        <pattern id="dither-fog" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
          <rect width="3.2" height="3.2" fill="#45183A"/>
          <rect width="1.6" height="1.6" fill="#FF5CA8"/>
          <rect x="1.6" y="1.6" width="1.6" height="1.6" fill="#FF5CA8"/>
        </pattern>
        <!-- Team Surf: coarser checkerboard dither, rotated 45 degrees -->
        <pattern id="dither-surf" width="5.2" height="5.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="5.2" height="5.2" fill="#123524"/>
          <rect width="2.6" height="2.6" fill="#43E97B"/>
          <rect x="2.6" y="2.6" width="2.6" height="2.6" fill="#43E97B"/>
        </pattern>
        <!-- Tied: alternating horizontal bands of both team dithers -->
        <pattern id="dither-tied" width="8" height="9.6" patternUnits="userSpaceOnUse">
          <rect width="8" height="4.8" fill="url(#dither-fog)"/>
          <rect y="4.8" width="8" height="4.8" fill="url(#dither-surf)"/>
        </pattern>
      </defs>
    </svg>

    <div class="legend" aria-hidden="true">
      <span class="key key--fog">
        <svg width="14" height="14"><rect width="14" height="14" fill="url(#dither-fog)"/></svg>FOG
      </span>
      <span class="key key--surf">
        <svg width="14" height="14"><rect width="14" height="14" fill="url(#dither-surf)"/></svg>SURF
      </span>
      <span class="key">
        <svg width="14" height="14"><rect width="14" height="14" fill="url(#dither-tied)"/></svg>TIED
      </span>
      <span class="key">
        <svg width="14" height="14"><rect width="14" height="14" fill="#181B38" stroke="#343A6E"/></svg>OPEN
      </span>
      <span class="key">
        <svg width="14" height="14"><rect width="14" height="14" fill="#12142E" stroke="#1D2142"/></svg>PARK
      </span>
    </div>
  </main>

  <!-- ============ ALERT LINE (signature) ============ -->
  <div class="alert" role="status" id="alert-line">
    <span class="cursor" aria-hidden="true">▶</span>
    MISSION CONTESTED — <span class="alert-surf">SURF</span> LEADS 2-1
  </div>

  <!-- ============ BOTTOM SHEET: QUEST LOG ============ -->
  <section class="sheet-frame" aria-label="Mission quest log">
    <div class="sheet" id="sheet"></div>
  </section>

</div>

<div class="scanlines" aria-hidden="true"></div>

<script src="shared.js"></script>
<script>
  // ---- map ----
  const svg = document.querySelector('svg.cc-map');
  ccRenderMap(svg, { badges: true, labels: ['mission'] });

  // Lift the selected polygon above its neighbors (shared edges would
  // otherwise overpaint the blinking selection border), but keep it
  // below badge/label text.
  const sel = svg.querySelector('.hood--selected');
  const firstText = svg.querySelector('.hood-badge, .hood-label');
  if (sel && firstText) svg.insertBefore(sel, firstText);

  // Park labels (parks are non-playable; muted).
  const NS = 'http://www.w3.org/2000/svg';
  CC.PARKS.forEach(p => {
    const [x, y] = ccCentroid(p.pts);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y + 1.5);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('class', 'park-label');
    t.textContent = p.id === 'ggpark' ? 'GG PARK' : 'PRESIDIO';
    svg.appendChild(t);
  });

  // ---- HP-style territory bars: one segment per held hood, max = 8 (majority of 15) ----
  const SEG_MAX = 8;
  function fillBar(rowId, team, n) {
    const bar = document.querySelector('#' + rowId + ' .bar');
    for (let i = 0; i < SEG_MAX; i++) {
      const s = document.createElement('span');
      s.className = 'seg' + (i < n ? ' seg--' + team : '');
      bar.appendChild(s);
    }
  }
  fillBar('bar-fog', 'fog', CC.score.fog);
  fillBar('bar-surf', 'surf', CC.score.surf);
  document.getElementById('hud-sub').textContent =
    'CONTESTED ' + CC.score.contested + ' · OPEN ' + CC.score.open + ' · HOLD 8 OF 15 TO WIN';

  // ---- countdown ----
  (function tick() {
    const el = document.getElementById('clock');
    let [h, m, s] = CC.clock.split(':').map(Number);
    let t = h * 3600 + m * 60 + s;
    const draw = () => {
      const hh = Math.floor(t / 3600),
            mm = String(Math.floor(t / 60) % 60).padStart(2, '0'),
            ss = String(t % 60).padStart(2, '0');
      el.textContent = hh + ':' + mm + ':' + ss;
    };
    draw();
    setInterval(() => { if (t > 0) { t--; draw(); } }, 1000);
  })();

  // ---- quest-log sheet, built from CC.detail ----
  (function buildSheet() {
    const d = CC.detail;
    const hood = CC.HOODS.find(h => h.id === d.id);
    const [f, s] = CC.state[d.id];
    const holder = s > f ? CC.teams.surf : CC.teams.fog;
    const hi = Math.max(f, s), lo = Math.min(f, s);

    const slot = (team, done) => {
      const tag = team.toUpperCase();
      const cls = done ? 'mark--' + team : 'mark--openslot';
      const box = done ? '[✓]' : '[ ]';
      const when = done ? done.toUpperCase() : 'OPEN';
      return '<span class="' + cls + '">' + box + ' ' + tag + ' ' + when + '</span>';
    };

    // Primary action goes on the viewer's (Team Fog's) first open challenge.
    const target = d.challenges.find(c => !c.fog);

    let html =
      '<div class="sheet-head">' +
        '<h2 class="sheet-title">' + hood.name.toUpperCase() + '</h2>' +
        '<span class="holder-tag">' + holder.short + ' HOLDS ' + hi + '–' + lo + '</span>' +
      '</div>' +
      '<p class="sheet-note"><b>' + holder.name + ' holds ' + hood.name + ' ' + hi + '–' + lo + '.</b> ' +
        d.note.split('. ').slice(1).join('. ') + '</p>';

    d.challenges.forEach(c => {
      html +=
        '<div class="quest">' +
          '<div class="quest-head">' +
            '<span class="quest-num">Q' + c.n + '</span>' +
            '<span class="quest-title">' + c.title + '</span>' +
          '</div>' +
          '<div class="quest-marks">' + slot('fog', c.fog) + slot('surf', c.surf) + '</div>' +
          (c === target
            ? '<div class="quest-actions">' +
                '<button class="btn btn-primary" type="button">MARK COMPLETE ▸</button>' +
                '<button class="btn btn-secondary" type="button">ADD PHOTO/VIDEO (OPTIONAL)</button>' +
              '</div>'
            : '') +
        '</div>';
    });

    document.getElementById('sheet').innerHTML = html;
  })();
</script>

</body>
</html>
