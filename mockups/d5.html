<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clipper Conquest — KARL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground-top: #ECF0F3;
    --ground-bottom: #FAFBFC;
    --card: #FFFFFF;
    --ink: #24303A;
    --muted: #6C7B88;
    --hairline: #DDE4E9;
    --fog: #D96248;
    --surf: #2F7E85;
    --radius-lg: 22px;
    --shadow-card: 0 6px 24px rgba(36, 48, 58, 0.10), 0 1px 3px rgba(36, 48, 58, 0.06);
    --display: "Bricolage Grotesque", "Albert Sans", system-ui, sans-serif;
    --body: "Albert Sans", system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: linear-gradient(to bottom, var(--ground-top), var(--ground-bottom));
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: linear-gradient(to bottom, var(--ground-top), var(--ground-bottom));
    overflow: hidden;
  }
  @media (min-width: 481px) {
    .app {
      box-shadow: 0 0 0 1px var(--hairline), 0 24px 60px rgba(36, 48, 58, 0.12);
    }
  }

  /* ---------- Header card ---------- */

  .score-card {
    flex: none;
    z-index: 3;
    margin: 12px 14px 0;
    padding: 14px 18px 12px;
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    animation: settle-down 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @supports (padding: max(0px)) {
    .score-card { margin-top: max(12px, env(safe-area-inset-top)); }
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .team-col { flex: none; }
  .team-col--surf { text-align: right; }

  .team-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .team-col--surf .team-tag { justify-content: flex-end; }

  .team-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .team-dot--fog { background: var(--fog); }
  .team-dot--surf { background: var(--surf); }

  .you-pill {
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--fog);
    border: 1px solid currentColor;
    border-radius: 99px;
    padding: 1px 5px;
    line-height: 1.3;
  }

  .team-count {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 750;
    line-height: 1.05;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .split-track { flex: 1; min-width: 0; padding-top: 4px; }

  .split-bar {
    display: flex;
    gap: 2px;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }
  .split-bar .seg--fog  { background: var(--fog);  border-radius: 3px 0 0 3px; }
  .split-bar .seg--surf { background: var(--surf); border-radius: 0 3px 3px 0; }

  .split-caption {
    margin-top: 6px;
    text-align: center;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .score-foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--hairline);
    font-size: 12.5px;
    color: var(--muted);
  }
  .score-foot .contested { font-weight: 500; }
  .score-foot .clock {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .score-foot .clock small {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
  }

  /* ---------- Map ---------- */

  .map-stage {
    flex: 1;
    min-height: 0;
    position: relative;
    z-index: 1;
    padding: 10px 12px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cc-map {
    width: 100%;
    height: 100%;
    max-height: 460px;
    display: block;
  }

  .hood {
    stroke: #FFFFFF;
    stroke-width: 1.5;
    stroke-linejoin: round;
    fill: #E2E8ED; /* untouched */
  }
  .hood--fog  { fill: var(--fog);  fill-opacity: 0.88; }
  .hood--surf { fill: var(--surf); fill-opacity: 0.88; }
  .hood--tied { fill: url(#tied-split); }

  .park {
    fill: #CFD9D0;
    stroke: #FFFFFF;
    stroke-width: 1.5;
    stroke-linejoin: round;
  }

  .hood--selected {
    stroke-width: 2.4;
    filter: drop-shadow(0 3px 7px rgba(36, 48, 58, 0.35));
  }

  .hood-badge {
    font-family: var(--display);
    font-size: 7.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    fill: var(--ink);
    paint-order: stroke;
    stroke: #FFFFFF;
    stroke-width: 2.4px;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .hood-label {
    font-family: var(--body);
    font-size: 5.8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    fill: var(--ink);
    paint-order: stroke;
    stroke: #FFFFFF;
    stroke-width: 2px;
    stroke-linejoin: round;
    pointer-events: none;
  }

  /* ---------- Frosted bottom sheet (signature) ---------- */

  .sheet {
    flex: none;
    position: relative;
    z-index: 4;
    margin-top: -26px; /* overlap the map so the frost actually blurs it */
    max-height: 64%;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -10px 34px rgba(36, 48, 58, 0.14), 0 -1px 0 rgba(255, 255, 255, 0.85) inset;
    animation: rise-up 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: 90ms;
  }

  .sheet-handle {
    flex: none;
    padding: 9px 0 3px;
    display: flex;
    justify-content: center;
  }
  .sheet-handle::before {
    content: "";
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: rgba(108, 123, 136, 0.38);
  }

  .sheet-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 20px 16px;
  }
  @supports (padding: max(0px)) {
    .sheet-scroll { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  }

  .sheet-eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sheet-title {
    font-family: var(--display);
    font-size: 27px;
    font-weight: 750;
    letter-spacing: -0.015em;
    line-height: 1.1;
    margin-top: 2px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 16px;
  }

  .ring { flex: none; width: 52px; height: 52px; }
  .ring .slot { fill: none; stroke-width: 5.5; stroke-linecap: round; }
  .ring .slot--fog  { stroke: var(--fog); }
  .ring .slot--surf { stroke: var(--surf); }
  .ring .ring-num {
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    fill: var(--ink);
  }

  .status-copy { min-width: 0; }
  .status-lead {
    font-weight: 600;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .status-lead .lead-team { color: var(--surf); }
  .status-note {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .chal-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 18px 2px 6px;
  }
  .chal-head h2 {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .chal-head .chal-tally {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .chal-list { list-style: none; }

  .chal {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 10px;
    border-radius: 14px;
  }
  .chal + .chal { border-top: 1px solid var(--hairline); }

  .chal--next {
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--hairline);
    padding: 12px 12px;
  }
  .chal--next + .chal { border-top: none; }

  .chal-ind {
    flex: none;
    width: 24px;
    height: 24px;
    margin-top: 1px;
    border-radius: 50%;
  }
  .chal-ind--open {
    border: 1.5px solid var(--hairline);
    background: transparent;
  }
  .chal-ind--done-fog {
    background: var(--fog);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chal-ind svg { display: block; }

  .chal-main { min-width: 0; flex: 1; }

  .chal-title {
    font-weight: 500;
    font-size: 14.5px;
    line-height: 1.35;
  }

  .next-tag {
    display: inline-block;
    vertical-align: 2px;
    margin-left: 6px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fog);
    border: 1px solid currentColor;
    border-radius: 99px;
    padding: 1px 6px;
  }

  .chal-meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-wrap: wrap;
    gap: 3px 10px;
  }
  .meta-item { display: inline-flex; align-items: center; gap: 5px; }
  .meta-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }
  .meta-dot--fog  { background: var(--fog); }
  .meta-dot--surf { background: var(--surf); }

  /* ---------- Actions ---------- */

  .sheet-actions { margin-top: 14px; }

  .btn-primary {
    display: block;
    width: 100%;
    padding: 15px 16px;
    border: none;
    border-radius: 99px;
    background: var(--ink);
    color: #FFFFFF;
    font-family: var(--body);
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease;
    box-shadow: 0 4px 14px rgba(36, 48, 58, 0.22);
  }
  .btn-primary:active { transform: scale(0.985); }

  .btn-ghost {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 11px 16px;
    border: none;
    border-radius: 99px;
    background: transparent;
    color: var(--muted);
    font-family: var(--body);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-ghost:active { color: var(--ink); }

  .honor-note {
    margin-top: 2px;
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
  }

  .btn-primary:focus-visible,
  .btn-ghost:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* ---------- Motion ---------- */

  @keyframes rise-up {
    from { transform: translateY(48px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes settle-down {
    from { transform: translateY(-14px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .score-card { animation: none; }
    .btn-primary { transition: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Score header -->
  <header class="score-card" aria-label="Game score">
    <div class="score-row">
      <div class="team-col team-col--fog">
        <span class="team-tag">
          <span class="team-dot team-dot--fog" aria-hidden="true"></span>
          Team Fog
          <span class="you-pill">You</span>
        </span>
        <div class="team-count" id="count-fog">4</div>
      </div>
      <div class="split-track" aria-hidden="true">
        <div class="split-bar" id="split-bar">
          <span class="seg--fog"></span>
          <span class="seg--surf"></span>
        </div>
        <div class="split-caption">Neighborhoods held</div>
      </div>
      <div class="team-col team-col--surf">
        <span class="team-tag">
          Team Surf
          <span class="team-dot team-dot--surf" aria-hidden="true"></span>
        </span>
        <div class="team-count" id="count-surf">3</div>
      </div>
    </div>
    <div class="score-foot">
      <span class="contested" id="contested-line">2 neighborhoods contested</span>
      <span class="clock"><span id="clock">2:47:12</span> <small>left</small></span>
    </div>
  </header>

  <!-- Map -->
  <main class="map-stage" aria-label="San Francisco territory map">
    <svg class="cc-map" viewBox="0 0 200 200" role="img"
         aria-label="Stylized San Francisco map. Team Fog holds 4 neighborhoods, Team Surf holds 3, 2 are contested. Mission is selected.">
      <defs>
        <linearGradient id="tied-split" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"    stop-color="#D96248" stop-opacity="0.88"></stop>
          <stop offset="0.44" stop-color="#D96248" stop-opacity="0.88"></stop>
          <stop offset="0.48" stop-color="#FFFFFF"></stop>
          <stop offset="0.52" stop-color="#FFFFFF"></stop>
          <stop offset="0.56" stop-color="#2F7E85" stop-opacity="0.88"></stop>
          <stop offset="1"    stop-color="#2F7E85" stop-opacity="0.88"></stop>
        </linearGradient>
      </defs>
    </svg>
  </main>

  <!-- Frosted bottom sheet -->
  <section class="sheet" aria-label="Mission neighborhood detail">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-scroll">
      <p class="sheet-eyebrow">Neighborhood</p>
      <h1 class="sheet-title" id="sheet-title">Mission</h1>

      <div class="status-row">
        <svg class="ring" viewBox="0 0 44 44" role="img"
             aria-label="Challenge progress ring: Team Fog 1 of 3, Team Surf 2 of 3.">
          <circle class="slot slot--fog"  cx="22" cy="22" r="16"
                  stroke-dasharray="28.5 72.1" transform="rotate(-86 22 22)"></circle>
          <circle class="slot slot--surf" cx="22" cy="22" r="16"
                  stroke-dasharray="28.5 72.1" transform="rotate(34 22 22)"></circle>
          <circle class="slot slot--surf" cx="22" cy="22" r="16"
                  stroke-dasharray="28.5 72.1" transform="rotate(154 22 22)"></circle>
          <text class="ring-num" x="22" y="26" text-anchor="middle">2–1</text>
        </svg>
        <div class="status-copy">
          <p class="status-lead"><span class="lead-team">Team Surf</span> holds Mission 2–1</p>
          <p class="status-note" id="flip-note"></p>
        </div>
      </div>

      <div class="chal-head">
        <h2>Challenges</h2>
        <span class="chal-tally" id="chal-tally"></span>
      </div>
      <ul class="chal-list" id="chal-list"></ul>

      <div class="sheet-actions">
        <button class="btn-primary" type="button" id="btn-complete">Mark complete</button>
        <button class="btn-ghost" type="button">Add photo or video (optional)</button>
        <p class="honor-note">Honor system — proof is optional.</p>
      </div>
    </div>
  </section>

</div>

<script src="shared.js"></script>
<script>
  // ----- Map -----
  const svg = document.querySelector('svg.cc-map');
  ccRenderMap(svg, { badges: true, labels: ['mission'] });

  // ----- Header, from CC verbatim -----
  document.getElementById('count-fog').textContent = CC.score.fog;
  document.getElementById('count-surf').textContent = CC.score.surf;
  document.getElementById('clock').textContent = CC.clock;
  document.getElementById('contested-line').textContent =
    CC.score.contested + ' neighborhoods contested';
  const bar = document.getElementById('split-bar');
  bar.children[0].style.flex = CC.score.fog;
  bar.children[1].style.flex = CC.score.surf;

  // ----- Sheet, from CC.detail -----
  const hood = CC.HOODS.find(h => h.id === CC.detail.id);
  document.getElementById('sheet-title').textContent = hood.name;
  document.getElementById('flip-note').textContent = CC.detail.note;

  const [fogDone, surfDone] = CC.state[CC.detail.id];
  document.getElementById('chal-tally').textContent =
    'Team Fog ' + fogDone + ' · Team Surf ' + surfDone + ' · 3 total';

  const CHECK =
    '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">' +
    '<path d="M2.5 6.4 L5 8.9 L9.6 3.4" fill="none" stroke="#FFFFFF" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const nextChallenge = CC.detail.challenges.find(c => !c.fog);
  const list = document.getElementById('chal-list');

  CC.detail.challenges.forEach(c => {
    const li = document.createElement('li');
    const isNext = c === nextChallenge;
    li.className = 'chal' + (isNext ? ' chal--next' : '');

    const ind = document.createElement('span');
    if (c.fog) {
      ind.className = 'chal-ind chal-ind--done-fog';
      ind.innerHTML = CHECK;
      ind.setAttribute('role', 'img');
      ind.setAttribute('aria-label', 'Done by Team Fog');
    } else {
      ind.className = 'chal-ind chal-ind--open';
      ind.setAttribute('role', 'img');
      ind.setAttribute('aria-label', 'Open for Team Fog');
    }

    const main = document.createElement('div');
    main.className = 'chal-main';

    const title = document.createElement('p');
    title.className = 'chal-title';
    title.textContent = c.title;
    if (isNext) {
      const tag = document.createElement('span');
      tag.className = 'next-tag';
      tag.textContent = 'Up next';
      title.appendChild(tag);
    }

    const meta = document.createElement('p');
    meta.className = 'chal-meta';
    const item = (teamKey, label, time) => {
      const s = document.createElement('span');
      s.className = 'meta-item';
      s.innerHTML = '<span class="meta-dot meta-dot--' + teamKey +
        '" aria-hidden="true"></span>' + label + ' · ' + time;
      return s;
    };
    if (c.fog)  meta.appendChild(item('fog',  'Team Fog',  c.fog));
    if (c.surf) meta.appendChild(item('surf', 'Team Surf', c.surf));
    if (!c.fog && !c.surf) meta.textContent = 'Open for both teams';

    main.appendChild(title);
    main.appendChild(meta);
    li.appendChild(ind);
    li.appendChild(main);
    list.appendChild(li);
  });

  document.getElementById('btn-complete').setAttribute(
    'aria-label', 'Mark complete: ' + nextChallenge.title);
</script>
</body>
</html>
