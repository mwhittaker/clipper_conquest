<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clipper Conquest — Wayfinding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root {
    --ground: #F7F5F0;      /* warm off-white */
    --sign: #26261F;        /* charcoal-black signage */
    --sign-deep: #191813;   /* recessed LED housing */
    --sign-line: #3A382E;   /* seams inside the sign */
    --white: #FFFFFF;
    --amber: #FFB43B;       /* LED readout */
    --fog: #C42847;         /* Team Fog — signal red */
    --surf: #1D6FB8;        /* Team Surf — signal blue */
    --surf-deep: #155A96;   /* street-blade sub-bar */
    --water: #D9DFE2;       /* pale cool gray bay */
    --open-fill: #EAE6DB;   /* untouched neighborhood */
    --park: #C6CBB0;        /* muted sage, non-playable */
    --ink: #26261F;
    --ink-soft: #55534A;
    --ink-faint: #8A877B;
    --hairline: #E4E1D6;
    --sans: 'Overpass', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Overpass Mono', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow-x: clip; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #1C1B16; /* dark platform behind the lit sign column */
    font-family: var(--sans);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    box-shadow: 0 0 0 1px var(--sign-line), 0 0 48px rgba(0,0,0,.5);
  }

  button { font: inherit; cursor: pointer; }
  button:focus-visible,
  a:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---------- station sign header ---------- */
  .sign { background: var(--sign); color: var(--white); flex: none; }

  .sign-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 16px 9px;
    border-bottom: 1px solid var(--white); /* thin white baseline rule */
  }
  .sign-top h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    line-height: 1;
  }
  .sign-live {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--amber);
  }
  .sign-live::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    margin-right: 5px;
    vertical-align: 1px;
  }

  .score {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 16px;
  }
  .route {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .rbadge {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    padding-top: 2px; /* Overpass optical centering */
  }
  .rbadge--fog  { background: var(--fog); }
  .rbadge--surf { background: var(--surf); }
  .rbadge--tied { background: linear-gradient(135deg, var(--fog) 50%, var(--surf) 50%); }
  .route-label { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
  .route-name {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .route-sub {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #9C9A8D;
  }
  .youtag {
    background: var(--amber);
    color: var(--sign);
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: .1em;
    padding: 2px 4px 1px;
    border-radius: 2px;
  }

  .led {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px 8px;
    background: var(--sign-deep);
    border-top: 1px solid var(--sign-line);
  }
  .led-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #C98F3A;
  }
  .led-time {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
    color: var(--amber);
    line-height: 1;
  }
  .led-time .tick { animation: cc-blink 1.2s linear infinite; }
  @keyframes cc-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    .led-time .tick { animation: none; }
  }

  /* ---------- system map ---------- */
  .map-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 12px 14px 10px;
  }
  .map-caption {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px;
  }
  .map-caption h2 {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .map-caption span {
    font-family: var(--mono);
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .map-case {
    flex: 1;
    min-height: 140px;
    border: 2px solid var(--sign);
    border-radius: 10px;
    background: var(--water);
    padding: 5px;
    display: flex;
  }
  svg.cc-map { width: 100%; height: 100%; display: block; }

  .hood { stroke: var(--white); stroke-width: 1.2; stroke-linejoin: round; }
  .hood--fog  { fill: var(--fog); }
  .hood--surf { fill: var(--surf); }
  .hood--tied { fill: url(#cc-split); }
  .hood--open { fill: var(--open-fill); stroke: var(--sign); stroke-width: .3; }
  .park { fill: var(--park); stroke: var(--white); stroke-width: 1.2; stroke-linejoin: round; }
  .hood--selected { stroke: var(--sign); stroke-width: 2; }

  .badge-pill { fill: var(--white); }
  .hood-badge {
    font-family: var(--mono);
    font-size: 5.5px;
    font-weight: 600;
    fill: var(--ink);
  }
  .hood-label {
    font-family: var(--sans);
    font-size: 5px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    fill: var(--white);
    transform: translateY(-1.5px);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    column-gap: 12px;
    row-gap: 4px;
    padding: 0 2px;
  }
  .legend li {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    line-height: 1;
  }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .swatch--fog  { background: var(--fog); }
  .swatch--surf { background: var(--surf); }
  .swatch--tied { background: linear-gradient(135deg, var(--fog) 50%, var(--surf) 50%); }
  .swatch--open { background: var(--open-fill); box-shadow: inset 0 0 0 1px #B9B4A6; }
  .swatch--park { background: var(--park); }

  /* ---------- departure-board bottom sheet ---------- */
  .sheet {
    flex: 0 1 auto;
    min-height: 0;
    max-height: 52dvh;
    overflow-y: auto;
    background: var(--white);
    border: 2px solid var(--sign);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 24px rgba(38,38,31,.16);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  }

  /* street blade — the signature */
  .blade {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surf);
  }
  .blade::after {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1.5px solid var(--white);
    border-radius: 5px;
    pointer-events: none;
  }
  .blade-name {
    padding: 12px 16px 9px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1;
  }
  .blade-sub {
    background: var(--surf-deep);
    padding: 6px 16px 5px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1.3;
  }

  .advisory {
    margin-top: 8px;
    background: var(--sign);
    border-radius: 6px;
    padding: 8px 12px 7px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1.55;
    color: var(--amber);
  }

  /* departure rows */
  .rows { margin-top: 4px; }
  .crow {
    display: grid;
    grid-template-columns: 24px 1fr auto;
    column-gap: 10px;
    align-items: start;
    padding: 12px 2px;
    border-bottom: 1px solid var(--hairline);
  }
  .crow:last-child { border-bottom: none; padding-bottom: 4px; }
  .cnum {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--sign);
    color: var(--white);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    padding-top: 2px;
    margin-top: 1px;
  }
  .ctitle {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.35;
    padding-top: 4px;
  }
  .ctitle--done { color: var(--ink-faint); }
  .cstatus {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    padding-top: 5px;
  }
  .sline {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .02em;
    color: #3B3A31;
    white-space: nowrap;
    line-height: 1;
  }
  .chip {
    width: 13px; height: 13px;
    border-radius: 2.5px;
    display: inline-grid;
    place-items: center;
    color: var(--white);
    font-family: var(--sans);
    font-size: 9px;
    font-weight: 800;
    line-height: 1;
  }
  .chip--fog  { background: var(--fog); }
  .chip--surf { background: var(--surf); }
  .cnone {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
    padding-right: 2px;
  }

  /* actions live inside the incomplete challenge row */
  .actions {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-primary {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 6px;
    background: var(--sign);
    color: var(--white);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .btn-primary:hover { background: #33322A; }
  .btn-primary:active { background: var(--sign-deep); }
  .btn-secondary {
    width: 100%;
    height: 42px;
    border: 1.5px solid var(--sign);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .btn-secondary:hover { background: var(--ground); }
  .btn-secondary:active { background: var(--hairline); }
  .fineprint {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: .03em;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="app">

  <!-- station sign -->
  <header class="sign">
    <div class="sign-top">
      <h1>Clipper Conquest</h1>
      <span class="sign-live">Live</span>
    </div>
    <div class="score" aria-label="Score: Team Fog holds 4 neighborhoods, Team Surf holds 3, 2 contested">
      <div class="route">
        <span class="rbadge rbadge--fog" id="score-fog">4</span>
        <span class="route-label">
          <span class="route-name">Team Fog <span class="youtag">You</span></span>
          <span class="route-sub">Held</span>
        </span>
      </div>
      <div class="route">
        <span class="rbadge rbadge--surf" id="score-surf">3</span>
        <span class="route-label">
          <span class="route-name">Team Surf</span>
          <span class="route-sub">Held</span>
        </span>
      </div>
      <div class="route">
        <span class="rbadge rbadge--tied" id="score-tied">2</span>
        <span class="route-label">
          <span class="route-name">Contested</span>
          <span class="route-sub">Tied</span>
        </span>
      </div>
    </div>
    <div class="led">
      <span class="led-label">Game ends in</span>
      <span class="led-time" id="clock">2:47:12</span>
    </div>
  </header>

  <!-- system map -->
  <section class="map-wrap">
    <div class="map-caption">
      <h2>System map</h2>
      <span>15 neighborhoods · 2 parks</span>
    </div>
    <div class="map-case">
      <svg class="cc-map" viewBox="0 0 200 200" role="img"
           aria-label="Map of San Francisco neighborhoods colored by the team that holds each. Mission is selected.">
        <defs>
          <linearGradient id="cc-split" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C42847"/>
            <stop offset="0.5" stop-color="#C42847"/>
            <stop offset="0.5" stop-color="#1D6FB8"/>
            <stop offset="1" stop-color="#1D6FB8"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <ul class="legend">
      <li><span class="swatch swatch--fog"></span>Fog held</li>
      <li><span class="swatch swatch--surf"></span>Surf held</li>
      <li><span class="swatch swatch--tied"></span>Contested</li>
      <li><span class="swatch swatch--open"></span>Untouched</li>
      <li><span class="swatch swatch--park"></span>Park</li>
    </ul>
  </section>

  <!-- departure board -->
  <section class="sheet" aria-label="Mission neighborhood detail">
    <div class="blade">
      <div class="blade-name" id="blade-name">Mission</div>
      <div class="blade-sub">Held by Team Surf 2–1</div>
    </div>
    <p class="advisory" id="advisory"></p>
    <div class="rows" id="rows"></div>
  </section>

</div>

<script src="shared.js"></script>
<script>
  const NS = 'http://www.w3.org/2000/svg';

  // ----- map -----
  const svg = document.querySelector('svg.cc-map');
  ccRenderMap(svg, { badges: true, labels: ['mission'] });

  // Lift the selected neighborhood above its siblings so its heavy charcoal
  // outline is not overpainted, but keep it under the badges and labels.
  const selected = svg.querySelector('.hood--selected');
  svg.insertBefore(selected, svg.querySelector('text'));

  // White pill behind each score badge, sized after the fonts arrive.
  document.fonts.ready.then(() => {
    svg.querySelectorAll('.hood-badge').forEach(t => {
      const b = t.getBBox();
      const r = document.createElementNS(NS, 'rect');
      const h = b.height + 2.2;
      r.setAttribute('x', b.x - 2.4);
      r.setAttribute('y', b.y - 1.1);
      r.setAttribute('width', b.width + 4.8);
      r.setAttribute('height', h);
      r.setAttribute('rx', h / 2);
      r.setAttribute('class', 'badge-pill');
      svg.insertBefore(r, t);
    });
  });

  // ----- header, verbatim from CC -----
  document.getElementById('score-fog').textContent = CC.score.fog;
  document.getElementById('score-surf').textContent = CC.score.surf;
  document.getElementById('score-tied').textContent = CC.score.contested;
  document.getElementById('clock').innerHTML =
    CC.clock.replace(/:/g, '<span class="tick">:</span>');

  // ----- bottom sheet, verbatim from CC.detail -----
  document.getElementById('blade-name').textContent =
    CC.HOODS.find(h => h.id === CC.detail.id).name;
  document.getElementById('advisory').textContent = CC.detail.note;

  const line = (team, time) =>
    `<span class="sline"><span class="chip chip--${team}" aria-hidden="true">✓</span>${CC.teams[team].short} ${time}</span>`;

  const statusHTML = c => {
    const lines = [];
    if (c.fog) lines.push(line('fog', c.fog));
    if (c.surf) lines.push(line('surf', c.surf));
    return lines.length ? lines.join('') : '<span class="cnone">—</span>';
  };

  const rowsEl = document.getElementById('rows');
  CC.detail.challenges.forEach(c => {
    const row = document.createElement('div');
    row.className = 'crow';
    row.innerHTML =
      `<span class="cnum" aria-hidden="true">${c.n}</span>` +
      `<div class="ctitle${c.fog ? ' ctitle--done' : ''}">${c.title}</div>` +
      `<div class="cstatus">${statusHTML(c)}</div>`;
    if (c.n === 3) {
      row.insertAdjacentHTML('beforeend',
        `<div class="actions">
           <button type="button" class="btn-primary">Mark complete</button>
           <button type="button" class="btn-secondary">Add photo or video (optional)</button>
           <p class="fineprint">Scores for Team Fog · Honor system — proof is optional</p>
         </div>`);
    }
    rowsEl.appendChild(row);
  });
</script>
</body>
</html>
